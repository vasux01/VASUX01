
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: vasux01
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2300F5FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF00C8
            dist/github-snake.gif?color_snake=%2300F5FF

      - name: Publish snake animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
